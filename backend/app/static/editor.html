<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>ReimagineAI Room Editor</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #14120F; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; }
  #canvas-host { position: absolute; inset: 0; }
  #hud { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; pointer-events: none; }
  #status { color: #EDE8DF; background: rgba(20,18,15,.72); border-radius: 10px; padding: 6px 12px; font-size: 13px; max-width: 60%; pointer-events: none; }
  .panel { position: absolute; left: 10px; right: 10px; bottom: 12px; background: rgba(26,23,19,.92); border: 1px solid rgba(255,255,255,.08); border-radius: 16px; padding: 10px 12px; display: none; color: #EDE8DF; backdrop-filter: blur(8px); }
  .panel.visible { display: block; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .row + .row { margin-top: 8px; }
  .btn { background: #2C2720; color: #EDE8DF; border: 1px solid rgba(255,255,255,.12); border-radius: 10px; padding: 8px 12px; font-size: 13px; cursor: pointer; }
  .btn:active { background: #3A342B; }
  .btn.danger { color: #E8877B; border-color: rgba(232,135,123,.4); }
  .btn.primary { background: #C98E5A; color: #191510; border: none; font-weight: 600; }
  .title { font-size: 13px; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  input[type=color] { width: 38px; height: 34px; border: none; border-radius: 8px; background: none; padding: 0; }
  #catalog-list { max-height: 200px; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
  .cat-item { background: #2C2720; border: 1px solid rgba(255,255,255,.1); border-radius: 10px; padding: 8px; font-size: 12px; cursor: pointer; }
  #addBtn { position: absolute; right: 12px; bottom: 12px; width: 46px; height: 46px; border-radius: 23px; background: #C98E5A; color: #191510; font-size: 26px; border: none; line-height: 44px; display: block; }
  #addBtn.hidden { display: none; }
</style>
</head>
<body>
<div id="canvas-host"></div>
<div id="hud"><div id="status">Loading room…</div>
  <div id="topbar" style="display:none; gap:8px; pointer-events:auto;">
    <button class="btn" id="undoBtn">↩ Undo</button>
    <button class="btn" id="aiBtn">✨ AI edit</button>
    <button class="btn" id="genBtn">🪄 Realistic</button>
    <button class="btn" id="renderBtn">📸 Render</button>
    <span id="saveState" style="color:#9C9284; font-size:12px; align-self:center;"></span>
  </div>
</div>

<div id="render-overlay" style="display:none; position:absolute; inset:0; background:rgba(10,9,7,.93); z-index:20; padding:16px; box-sizing:border-box; flex-direction:column; gap:10px; align-items:center; justify-content:center;">
  <img id="render-result" style="max-width:100%; max-height:82%; border-radius:14px; box-shadow:0 8px 40px rgba(0,0,0,.6);" />
  <div style="display:flex; gap:10px;">
    <a class="btn" id="renderDownload" download="reimagine-render.png" style="text-decoration:none;">⬇ Download</a>
    <button class="btn primary" id="renderClose">Close</button>
  </div>
</div>

<div id="object-panel" class="panel">
  <div class="row">
    <span class="title" id="obj-title">Object</span>
    <input type="color" id="obj-color" value="#8a7f72" />
    <button class="btn" id="rotL">⟲ 15°</button>
    <button class="btn" id="rotR">⟳ 15°</button>
    <button class="btn" id="scaleDown">S−</button>
    <button class="btn" id="scaleUp">S＋</button>
  </div>
  <div class="row">
    <button class="btn" id="swapBtn">Swap model</button>
    <button class="btn" id="simpleBtn" style="display:none">Simple model</button>
    <button class="btn" id="dupBtn">Duplicate</button>
    <button class="btn danger" id="delBtn">Remove</button>
    <span style="flex:1"></span>
    <button class="btn primary" id="doneBtn">Done</button>
  </div>
</div>

<div id="shell-panel" class="panel">
  <div class="row">
    <span class="title" id="shell-title">Walls</span>
    <input type="color" id="shell-color" value="#f2ede4" />
    <span style="flex:1"></span>
    <button class="btn primary" id="shellDoneBtn">Done</button>
  </div>
</div>

<div id="add-panel" class="panel">
  <div class="row"><span class="title">Add furniture</span>
    <button class="btn" id="addCloseBtn">Close</button></div>
  <div id="catalog-list"></div>
</div>

<button id="addBtn">＋</button>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.164.1/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.164.1/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ---------------- Standalone mode (web) ----------------
// When opened as ?scene_id=...&token=... the editor talks to the API
// directly (Flutter web opens it in a browser tab; no JS bridge there).
const urlParams = new URLSearchParams(location.search);
const STANDALONE = urlParams.has('scene_id');
const API_BASE = urlParams.get('api') || location.origin;
const AUTH_TOKEN = urlParams.get('token') || '';
let standaloneSceneId = urlParams.get('scene_id');
let serverVersion = 0;
const undoStack = [];
const pendingOps = [];
let saveTimer = null;

async function apiFetch(path, opts = {}) {
  const res = await fetch(`${API_BASE}/api/v1${path}`, {
    ...opts,
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${AUTH_TOKEN}`,
      ...(opts.headers || {}),
    },
  });
  if (!res.ok) throw new Error(`API ${res.status}: ${await res.text()}`);
  return res.json();
}

function setSaveState(text) { document.getElementById('saveState').textContent = text; }

async function flushOpsStandalone() {
  if (!pendingOps.length) return;
  const ops = pendingOps.splice(0);
  setSaveState('Saving…');
  try {
    const prev = serverVersion;
    const resp = await apiFetch(`/scenes/${standaloneSceneId}/ops`, {
      method: 'POST',
      body: JSON.stringify({ ops }),
    });
    undoStack.push(prev);
    serverVersion = resp.version;
    setSaveState('Saved ✓');
    setTimeout(() => setSaveState(''), 1500);
  } catch (e) {
    setSaveState('Save failed');
    console.error(e);
  }
}

async function standaloneUndo() {
  await flushOpsStandalone();
  if (!undoStack.length) { setSaveState('Nothing to undo'); return; }
  const target = undoStack.pop();
  setSaveState('Undoing…');
  try {
    const resp = await apiFetch(`/scenes/${standaloneSceneId}/revert/${target}`, { method: 'POST' });
    serverVersion = resp.version;
    window.RAI.refreshScene(resp.data);
    setSaveState('');
  } catch (e) { setSaveState('Undo failed'); console.error(e); }
}

async function standaloneAiEdit() {
  const instruction = window.prompt('Describe the change (e.g. "move the sofa to the back wall and make it navy"):');
  if (!instruction) return;
  await flushOpsStandalone();
  setSaveState('Applying AI edit…');
  try {
    const prev = serverVersion;
    const resp = await apiFetch(`/scenes/${standaloneSceneId}/nl-edit`, {
      method: 'POST',
      body: JSON.stringify({ instruction }),
    });
    if ((resp.applied_ops || []).length) {
      undoStack.push(prev);
      serverVersion = resp.version;
      window.RAI.refreshScene(resp.data);
    }
    setSaveState(resp.message || '');
    setTimeout(() => setSaveState(''), 4000);
  } catch (e) { setSaveState('AI edit failed'); console.error(e); }
}

async function standaloneEnhance() {
  if (!window.confirm('Generate realistic 3D models of your furniture from the photo? This takes 1-3 minutes.')) return;
  await flushOpsStandalone();
  const btn = document.getElementById('genBtn');
  btn.disabled = true;
  setSaveState('Generating realistic furniture… (1-3 min)');
  try {
    const resp = await apiFetch(`/scenes/${standaloneSceneId}/enhance`, { method: 'POST' });
    serverVersion = resp.version;
    window.RAI.refreshScene(resp.data);
    setSaveState('Realistic models applied ✓');
  } catch (e) {
    const msg = String(e.message || e);
    setSaveState(msg.includes('FAL_API_KEY') || msg.includes('not configured')
      ? 'Set FAL_API_KEY on the server to enable this'
      : 'Generation failed — try again');
    console.error(e);
  } finally {
    btn.disabled = false;
    setTimeout(() => setSaveState(''), 6000);
  }
}

function captureCanvas() {
  // Hide helpers for a clean shot
  const hadHighlight = !!highlight;
  if (highlight) { scene3.remove(highlight); }
  if (roomMeshes.grid) roomMeshes.grid.visible = false;
  renderer.render(scene3, camera);
  const shot = renderer.domElement.toDataURL('image/jpeg', 0.92);
  if (roomMeshes.grid) roomMeshes.grid.visible = true;
  if (hadHighlight && selected?.type === 'object') {
    highlight = new THREE.BoxHelper(objectGroups.get(selected.id), 0xC98E5A);
    scene3.add(highlight);
  }
  return shot;
}

function showRender(dataUrl) {
  const overlay = document.getElementById('render-overlay');
  document.getElementById('render-result').src = dataUrl;
  document.getElementById('renderDownload').href = dataUrl;
  overlay.style.display = 'flex';
}
document.getElementById('renderClose').onclick = () =>
  document.getElementById('render-overlay').style.display = 'none';

async function standalonePhotorealRender() {
  const btn = document.getElementById('renderBtn');
  btn.disabled = true;
  setSaveState('Rendering photoreal image… (~30s)');
  try {
    const shot = captureCanvas();
    const resp = await apiFetch(`/scenes/${standaloneSceneId}/render`, {
      method: 'POST',
      body: JSON.stringify({ image_base64: shot }),
    });
    showRender(resp.image);
    setSaveState('');
  } catch (e) {
    setSaveState('Render failed — try again in a minute');
    console.error(e);
    setTimeout(() => setSaveState(''), 5000);
  } finally {
    btn.disabled = false;
  }
}

async function standaloneInit() {
  document.getElementById('topbar').style.display = 'flex';
  document.getElementById('undoBtn').onclick = standaloneUndo;
  document.getElementById('aiBtn').onclick = standaloneAiEdit;
  document.getElementById('genBtn').onclick = standaloneEnhance;
  document.getElementById('renderBtn').onclick = standalonePhotorealRender;
  window.addEventListener('beforeunload', flushOpsStandalone);
  try {
    const [scene, cat] = await Promise.all([
      apiFetch(`/scenes/${standaloneSceneId}`),
      apiFetch('/scenes/catalog'),
    ]);
    serverVersion = scene.version;
    window.RAI.loadScene(scene.data, cat);
  } catch (e) {
    setStatus(`Could not load scene: ${e.message}`);
  }
}

// ---------------- Bridge to Flutter ----------------
let flutterReady = !!window.flutter_inappwebview;
const pendingCalls = [];
window.addEventListener('flutterInAppWebViewPlatformReady', () => {
  flutterReady = true;
  pendingCalls.splice(0).forEach(([name, arg]) => send(name, arg));
});
function send(name, arg) {
  if (window.flutter_inappwebview && flutterReady) {
    window.flutter_inappwebview.callHandler(name, arg);
  } else if (window.flutter_inappwebview) {
    pendingCalls.push([name, arg]);
  } else {
    console.log('[bridge]', name, JSON.stringify(arg)); // browser dev mode
  }
}

// ---------------- State ----------------
let scene3, camera, renderer, controls, raycaster;
let sceneData = null;      // the scene JSON document
let catalog = { entries: [] };
let objectGroups = new Map(); // object id -> THREE.Group
let roomMeshes = { walls: null, floor: null, ceiling: null };
let selected = null;       // { type: 'object', id } | { type: 'wall'|'floor' }
let dragging = false;
let dragOffset = new THREE.Vector3();
const floorPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const gltfLoader = new GLTFLoader();
let localIdCounter = 1;

const statusEl = document.getElementById('status');
const objPanel = document.getElementById('object-panel');
const shellPanel = document.getElementById('shell-panel');
const addPanel = document.getElementById('add-panel');
const addBtn = document.getElementById('addBtn');

// ---------------- Renderer setup ----------------
function initGL() {
  const host = document.getElementById('canvas-host');
  renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  host.appendChild(renderer.domElement);

  scene3 = new THREE.Scene();
  scene3.background = new THREE.Color(0x14120f);

  camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.05, 100);
  camera.position.set(3.2, 2.6, 4.2);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 0.8, 0);
  controls.maxPolarAngle = Math.PI * 0.495;
  controls.minDistance = 1.2;
  controls.maxDistance = 14;
  controls.enableDamping = true;

  scene3.add(new THREE.AmbientLight(0xffffff, 0.65));
  const sun = new THREE.DirectionalLight(0xfff2e0, 1.4);
  sun.position.set(4, 7, 3);
  scene3.add(sun);
  const fill = new THREE.DirectionalLight(0xbcd0ff, 0.5);
  fill.position.set(-5, 4, -4);
  scene3.add(fill);

  raycaster = new THREE.Raycaster();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  renderer.domElement.addEventListener('pointerdown', onPointerDown);
  renderer.domElement.addEventListener('pointermove', onPointerMove);
  renderer.domElement.addEventListener('pointerup', onPointerUp);

  (function loop() {
    requestAnimationFrame(loop);
    controls.update();
    renderer.render(scene3, camera);
  })();
}

// ---------------- Materials ----------------
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({
    color: new THREE.Color(color),
    roughness: opts.roughness ?? 0.85,
    metalness: opts.metalness ?? 0.0,
    ...opts.extra,
  });
}

// ---------------- Room shell ----------------
function makeFloorTexture(kind, colorHex) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = 512;
  const ctx = canvas.getContext('2d');
  const base = new THREE.Color(colorHex);
  ctx.fillStyle = `#${base.getHexString()}`;
  ctx.fillRect(0, 0, 512, 512);
  if (kind === 'wood') {
    const plankW = 512 / 8;
    for (let i = 0; i < 8; i++) {
      const col = base.clone().multiplyScalar(0.82 + ((i * 37) % 12) / 40);
      ctx.fillStyle = `#${col.getHexString()}`;
      ctx.fillRect(i * plankW + 1, 0, plankW - 2, 512);
      ctx.fillStyle = 'rgba(0,0,0,0.22)';
      ctx.fillRect(i * plankW, 0, 1, 512);
      ctx.fillRect(i * plankW, (i * 197) % 512, plankW, 2); // board seam
    }
  } else { // tile
    ctx.strokeStyle = 'rgba(0,0,0,0.16)';
    ctx.lineWidth = 2;
    for (let p = 0; p <= 512; p += 128) {
      ctx.beginPath(); ctx.moveTo(p, 0); ctx.lineTo(p, 512); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, p); ctx.lineTo(512, p); ctx.stroke();
    }
  }
  const tex = new THREE.CanvasTexture(canvas);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function floorKind(materialDef) {
  const t = (materialDef.texture || '').toLowerCase();
  if (/wood|plank|parquet|laminate|hardwood/.test(t)) return 'wood';
  if (/tile|ceramic|marble|stone/.test(t)) return 'tile';
  return null;
}

function buildFeature(f, room) {
  const g = new THREE.Group();
  const wallThick = 0.05;
  if (f.type === 'window') {
    const frame = box(f.width_m, f.height_m, wallThick, '#F2F2EE');
    const pane = box(f.width_m * 0.92, f.height_m * 0.88, 0.02, f.color);
    pane.material.roughness = 0.2;
    pane.material.emissive = new THREE.Color(f.color).multiplyScalar(0.55);
    pane.position.z = 0.02;
    const barV = box(0.03, f.height_m * 0.88, 0.03, '#F2F2EE'); barV.position.z = 0.035;
    const barH = box(f.width_m * 0.92, 0.03, 0.03, '#F2F2EE'); barH.position.z = 0.035;
    g.add(frame, pane, barV, barH);
  } else if (f.type === 'door') {
    const slab = box(f.width_m, f.height_m, wallThick, f.color);
    const knob = new THREE.Mesh(new THREE.SphereGeometry(0.03, 12, 10), mat('#B8A97C', { metalness: 0.7, roughness: 0.3 }));
    knob.position.set(f.width_m * 0.38, 0, 0.045);
    g.add(slab, knob);
  } else if (f.type === 'art') {
    // A framed picture (or a gallery group rendered as a grid of frames)
    const cols = f.width_m > 1.2 ? 3 : (f.width_m > 0.7 ? 2 : 1);
    const rows = f.height_m > 0.9 ? 2 : 1;
    const gap = 0.05;
    const fw = (f.width_m - gap * (cols - 1)) / cols;
    const fh = (f.height_m - gap * (rows - 1)) / rows;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const frame = box(fw, fh, 0.025, '#F5F2EA');
        const picture = box(fw * 0.82, fh * 0.8, 0.01, shade(f.color, 0.9 + ((r * cols + c) % 3) * 0.08));
        frame.position.set(-f.width_m / 2 + fw / 2 + c * (fw + gap), f.height_m / 2 - fh / 2 - r * (fh + gap), 0);
        picture.position.copy(frame.position); picture.position.z = 0.015;
        g.add(frame, picture);
      }
    }
  } else if (f.type === 'mirror') {
    // Wall mirror: round when roughly square, otherwise rectangular
    const round = Math.abs(f.width_m - f.height_m) < 0.25;
    const glassMat = mat('#C3D3DC', { roughness: 0.04, metalness: 0.85 });
    if (round) {
      const rr = Math.min(f.width_m, f.height_m) / 2;
      const rim = new THREE.Mesh(new THREE.TorusGeometry(rr, 0.02, 10, 40), mat('#2E2A26'));
      const glass = new THREE.Mesh(new THREE.CircleGeometry(rr * 0.96, 40), glassMat);
      glass.position.z = 0.005;
      g.add(rim, glass);
    } else {
      const frame = box(f.width_m, f.height_m, 0.03, '#2E2A26');
      const glass = box(f.width_m * 0.92, f.height_m * 0.92, 0.01, '#C3D3DC');
      glass.material = glassMat; glass.position.z = 0.02;
      g.add(frame, glass);
    }
  } else if (f.type === 'pendant') {
    // Hanging ceiling light: cord + shade with a soft glow
    const drop = f.height_m;
    const cord = cyl(0.008, drop * 0.6, '#4A4640');
    cord.position.y = drop * 0.2;
    const shadeM = new THREE.Mesh(
      new THREE.SphereGeometry(f.width_m / 2, 18, 12, 0, Math.PI * 2, 0, Math.PI * 0.6),
      mat(f.color, { extra: { side: THREE.DoubleSide, emissive: new THREE.Color('#FFF3DC').multiplyScalar(0.35) } })
    );
    shadeM.position.y = -drop * 0.18;
    const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.035, 10, 8),
      mat('#FFF6E0', { extra: { emissive: new THREE.Color('#FFE9B8').multiplyScalar(0.9) } }));
    bulb.position.y = -drop * 0.25;
    g.add(cord, shadeM, bulb);
  } else { // curtain: vertical slats faking folds
    const n = Math.max(4, Math.round(f.width_m * 5));
    const slatW = f.width_m / n;
    for (let i = 0; i < n; i++) {
      const slat = box(slatW * 0.96, f.height_m, 0.03, i % 2 ? f.color : shade(f.color, 0.86));
      slat.position.set(-f.width_m / 2 + slatW * (i + 0.5), 0, (i % 2) * 0.03);
      g.add(slat);
    }
  }

  const y = f.bottom_m + f.height_m / 2;
  const inset = 0.04;
  const w = room.width_m, d = room.depth_m;
  if (f.wall === 'ceiling') {
    g.position.set(f.center_x_m, room.height_m - f.height_m * 0.2 - 0.02, f.center_z_m || 0);
    g.userData = { featureId: f.id, featureType: f.type };
    return g;
  }
  if (f.wall === 'back') {
    g.position.set(f.center_x_m, y, -d / 2 + inset);
  } else if (f.wall === 'front') {
    g.position.set(f.center_x_m, y, d / 2 - inset);
    g.rotation.y = Math.PI;
  } else if (f.wall === 'left') {
    g.position.set(-w / 2 + inset, y, f.center_x_m);
    g.rotation.y = Math.PI / 2;
  } else { // right
    g.position.set(w / 2 - inset, y, f.center_x_m);
    g.rotation.y = -Math.PI / 2;
  }
  g.userData = { featureId: f.id, featureType: f.type };
  return g;
}

function buildRoom() {
  ['walls', 'floor', 'ceiling', 'grid', 'features'].forEach(k => {
    if (roomMeshes[k]) { scene3.remove(roomMeshes[k]); roomMeshes[k] = null; }
  });
  const r = sceneData.room;
  const w = r.width_m, d = r.depth_m, h = r.height_m;

  // Interior-visible box for walls+ceiling (BackSide: near walls auto-hide)
  const wallGeo = new THREE.BoxGeometry(w, h, d);
  const wallMat = mat(r.wall_material.color, { roughness: 0.95 });
  const ceilMat = mat(r.ceiling_material?.color || '#ffffff', { roughness: 0.95 });
  const invisible = new THREE.MeshBasicMaterial({ visible: false });
  wallMat.side = THREE.BackSide; ceilMat.side = THREE.BackSide;
  // Box material order: +x, -x, +y (ceiling), -y (floor), +z, -z
  const walls = new THREE.Mesh(wallGeo, [wallMat, wallMat, ceilMat, invisible, wallMat, wallMat]);
  walls.position.set(0, h / 2, 0);
  walls.name = 'walls';
  scene3.add(walls);
  roomMeshes.walls = walls;

  const kind = floorKind(r.floor_material);
  const floorMat = mat(kind ? '#FFFFFF' : r.floor_material.color, { roughness: 0.9 });
  if (kind) {
    const tex = makeFloorTexture(kind, r.floor_material.color);
    tex.repeat.set(Math.max(1, w / 2.2), Math.max(1, d / 2.2));
    floorMat.map = tex;
  }
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(w, d), floorMat);
  floor.rotation.x = -Math.PI / 2;
  floor.name = 'floor';
  scene3.add(floor);
  roomMeshes.floor = floor;

  // Windows / doors / curtains
  const features = new THREE.Group();
  (r.features || []).forEach(f => features.add(buildFeature(f, r)));
  scene3.add(features);
  roomMeshes.features = features;

  const grid = new THREE.GridHelper(Math.max(w, d), Math.round(Math.max(w, d) * 2), 0x000000, 0x000000);
  grid.material.transparent = true; grid.material.opacity = 0.07;
  grid.position.y = 0.002;
  scene3.add(grid);
  roomMeshes.grid = grid;

  controls.target.set(0, Math.min(1.0, h / 2.5), 0);
}

function box(w, h, d, color) { return new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(color)); }
function cyl(r, h, color) { return new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 24), mat(color)); }
function legs(w, d, height, color, r) {
  const g = new THREE.Group();
  const inset = Math.min(0.08, w * 0.08);
  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx, sz]) => {
    const leg = cyl(r, height, color);
    leg.position.set(sx * (w/2 - inset), height / 2, sz * (d/2 - inset));
    g.add(leg);
  });
  return g;
}
function shade(hex, factor) {
  const c = new THREE.Color(hex); c.multiplyScalar(factor);
  return `#${c.getHexString()}`;
}

// ---------------- Object lifecycle ----------------
function catalogEntry(ref) { return catalog.entries.find(e => e.id === ref); }

function buildObject(obj) {
  const entry = obj.asset?.type === 'catalog' ? catalogEntry(obj.asset.ref) : null;
  const dims = obj.dimensions_m || entry?.dims_m || [1, 1, 1];
  const color = obj.material_override?.color || entry?.default_color || '#9A9A9A';

  let group;
  const glbSrc = obj.asset?.type === 'url' ? obj.asset.ref : entry?.glb_url;
  if (glbSrc) {
    group = new THREE.Group();
    const src = glbSrc.startsWith('http') ? glbSrc : location.origin + glbSrc;
    // Placeholder box while the generated mesh loads
    const placeholder = box(dims[0], dims[1], dims[2], color);
    placeholder.material.transparent = true; placeholder.material.opacity = 0.25;
    placeholder.position.y = dims[1] / 2;
    group.add(placeholder);
    gltfLoader.load(src, (gltf) => {
      const model = gltf.scene;
      const bb = new THREE.Box3().setFromObject(model);
      const size = bb.getSize(new THREE.Vector3());
      // Generated meshes come back in arbitrary orientation, so match the
      // mesh's LARGEST horizontal span to the object's largest footprint
      // dimension. Only cap by height so weird meshes can't explode.
      const targetSpan = Math.max(dims[0], dims[2]);
      const meshSpan = Math.max(size.x, size.z);
      let s = targetSpan / meshSpan;
      if (size.y * s > dims[1] * 1.8) s = (dims[1] * 1.8) / size.y;
      model.scale.setScalar(s);
      const bb2 = new THREE.Box3().setFromObject(model);
      const center = bb2.getCenter(new THREE.Vector3());
      model.position.x -= center.x;
      model.position.z -= center.z;
      model.position.y -= bb2.min.y;
      group.remove(placeholder);
      group.add(model);
    }, undefined, (err) => {
      console.error('GLB load failed, keeping placeholder:', err);
      placeholder.material.opacity = 1.0;
    });
  } else {
    const builderName = entry?.builder || 'generic';
    const builder = BUILDERS[builderName] || BUILDERS.generic;
    group = builder(dims, color);
  }

  group.name = obj.id;
  group.userData = { objectId: obj.id, category: obj.category };
  applyTransform(group, obj.transform);
  return group;
}

function applyTransform(group, t) {
  group.position.set(t.pos[0], t.pos[1], t.pos[2]);
  group.rotation.y = THREE.MathUtils.degToRad(t.rot_y_deg || 0);
  group.scale.set(t.scale?.[0] ?? 1, t.scale?.[1] ?? 1, t.scale?.[2] ?? 1);
}

function rebuildObject(objId) {
  const obj = sceneData.objects.find(o => o.id === objId);
  const old = objectGroups.get(objId);
  if (old) scene3.remove(old);
  if (!obj) { objectGroups.delete(objId); return; }
  const group = buildObject(obj);
  objectGroups.set(objId, group);
  scene3.add(group);
  return group;
}

function rebuildAll() {
  objectGroups.forEach(g => scene3.remove(g));
  objectGroups.clear();
  buildRoom();
  (sceneData.objects || []).forEach(obj => {
    const g = buildObject(obj);
    objectGroups.set(obj.id, g);
    scene3.add(g);
  });
  setStatus(`${sceneData.room_type || 'Room'} · ${sceneData.objects.length} objects — tap to select`);
}

// ---------------- Selection & panels ----------------
let highlight = null;
function setStatus(text) { statusEl.textContent = text; }

function select(sel) {
  deselect(false);
  selected = sel;
  addBtn.classList.add('hidden');
  if (sel.type === 'object') {
    const group = objectGroups.get(sel.id);
    const obj = sceneData.objects.find(o => o.id === sel.id);
    if (!group || !obj) return;
    highlight = new THREE.BoxHelper(group, 0xC98E5A);
    scene3.add(highlight);
    document.getElementById('obj-title').textContent = obj.label || obj.category;
    const entry = catalogEntry(obj.asset?.ref);
    document.getElementById('obj-color').value = obj.material_override?.color || entry?.default_color || '#9a9a9a';
    document.getElementById('simpleBtn').style.display =
      obj.asset?.type === 'url' ? '' : 'none';
    objPanel.classList.add('visible');
    setStatus('Drag the item to move it');
  } else if (sel.type === 'feature') {
    const f = (sceneData.room.features || []).find(x => x.id === sel.id);
    if (!f) return;
    document.getElementById('shell-title').textContent =
      f.type.charAt(0).toUpperCase() + f.type.slice(1);
    document.getElementById('shell-color').value = f.color;
    shellPanel.classList.add('visible');
    setStatus(`Editing ${f.type} color`);
  } else {
    document.getElementById('shell-title').textContent = sel.type === 'floor' ? 'Floor' : 'Walls';
    const m = sel.type === 'floor' ? sceneData.room.floor_material : sceneData.room.wall_material;
    document.getElementById('shell-color').value = m.color;
    shellPanel.classList.add('visible');
    setStatus(`Editing ${sel.type} color`);
  }
  send('selection', { selected: sel });
}

function deselect(notify = true) {
  if (highlight) { scene3.remove(highlight); highlight = null; }
  selected = null;
  objPanel.classList.remove('visible');
  shellPanel.classList.remove('visible');
  addPanel.classList.remove('visible');
  addBtn.classList.remove('hidden');
  if (sceneData) setStatus(`${sceneData.room_type || 'Room'} · tap an item to edit`);
  if (notify) send('selection', { selected: null });
}

// ---------------- Pointer handling ----------------
function ndc(e) {
  const rect = renderer.domElement.getBoundingClientRect();
  return new THREE.Vector2(
    ((e.clientX - rect.left) / rect.width) * 2 - 1,
    -((e.clientY - rect.top) / rect.height) * 2 + 1
  );
}

function pickObject(e) {
  raycaster.setFromCamera(ndc(e), camera);
  const groups = [...objectGroups.values()];
  const hits = raycaster.intersectObjects(groups, true);
  if (!hits.length) return null;
  let node = hits[0].object;
  while (node && !node.userData?.objectId) node = node.parent;
  return node?.userData?.objectId ? { id: node.userData.objectId, point: hits[0].point } : null;
}

let downAt = null;
function onPointerDown(e) {
  downAt = { x: e.clientX, y: e.clientY, t: Date.now() };
  const hit = pickObject(e);
  if (hit && selected?.type === 'object' && selected.id === hit.id) {
    // Start dragging the already-selected object
    dragging = true;
    controls.enabled = false;
    const group = objectGroups.get(hit.id);
    const pt = new THREE.Vector3();
    raycaster.setFromCamera(ndc(e), camera);
    raycaster.ray.intersectPlane(floorPlane, pt);
    dragOffset.copy(group.position).sub(pt);
  }
}

function onPointerMove(e) {
  if (!dragging || !selected || selected.type !== 'object') return;
  const group = objectGroups.get(selected.id);
  const obj = sceneData.objects.find(o => o.id === selected.id);
  if (!group || !obj) return;
  raycaster.setFromCamera(ndc(e), camera);
  const pt = new THREE.Vector3();
  if (!raycaster.ray.intersectPlane(floorPlane, pt)) return;
  pt.add(dragOffset);
  const halfW = sceneData.room.width_m / 2 - (obj.dimensions_m?.[0] || 1) / 2;
  const halfD = sceneData.room.depth_m / 2 - (obj.dimensions_m?.[2] || 1) / 2;
  group.position.x = THREE.MathUtils.clamp(pt.x, -Math.abs(halfW), Math.abs(halfW));
  group.position.z = THREE.MathUtils.clamp(pt.z, -Math.abs(halfD), Math.abs(halfD));
  if (highlight) highlight.update();
}

function onPointerUp(e) {
  const wasDrag = dragging;
  if (dragging && selected?.type === 'object') {
    dragging = false;
    controls.enabled = true;
    const group = objectGroups.get(selected.id);
    const obj = sceneData.objects.find(o => o.id === selected.id);
    if (group && obj) {
      obj.transform.pos = [round3(group.position.x), 0, round3(group.position.z)];
      emitOp({ op: 'move', target: selected.id, value: { pos: obj.transform.pos } });
    }
    return;
  }
  // Tap (not a drag of the camera)
  if (!downAt) return;
  const dist = Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y);
  const dt = Date.now() - downAt.t;
  downAt = null;
  if (wasDrag || dist > 8 || dt > 400) return;

  const hit = pickObject(e);
  if (hit) { select({ type: 'object', id: hit.id }); return; }

  // Shell pick: features (windows/doors/curtains) first, then floor/walls
  raycaster.setFromCamera(ndc(e), camera);
  const shellTargets = [roomMeshes.features, roomMeshes.floor, roomMeshes.walls].filter(Boolean);
  const shellHits = raycaster.intersectObjects(shellTargets, true);
  if (shellHits.length) {
    let node = shellHits[0].object;
    while (node && !node.userData?.featureId) node = node.parent;
    if (node?.userData?.featureId) {
      select({ type: 'feature', id: node.userData.featureId });
      return;
    }
    select({ type: shellHits[0].object.name === 'floor' ? 'floor' : 'wall' });
    return;
  }
  deselect();
}

function round3(v) { return Math.round(v * 1000) / 1000; }

// ---------------- Ops ----------------
function emitOp(op) {
  if (STANDALONE) {
    pendingOps.push(op);
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flushOpsStandalone, 900);
    setSaveState('Unsaved changes…');
    return;
  }
  send('op', op);
}

// ---------------- Panel wiring ----------------
document.getElementById('doneBtn').onclick = () => deselect();
document.getElementById('shellDoneBtn').onclick = () => deselect();

document.getElementById('rotL').onclick = () => rotateSelected(15);
document.getElementById('rotR').onclick = () => rotateSelected(-15);

document.getElementById('scaleUp').onclick = () => scaleSelected(1.12);
document.getElementById('scaleDown').onclick = () => scaleSelected(1 / 1.12);
function scaleSelected(factor) {
  if (selected?.type !== 'object') return;
  const obj = sceneData.objects.find(o => o.id === selected.id);
  const group = objectGroups.get(selected.id);
  if (!obj || !group) return;
  const sc = (obj.transform.scale || [1, 1, 1]).map(v =>
    Math.min(4, Math.max(0.25, v * factor)));
  obj.transform.scale = sc.map(v => Math.round(v * 1000) / 1000);
  group.scale.set(sc[0], sc[1], sc[2]);
  if (highlight) highlight.update();
  emitOp({ op: 'scale', target: selected.id, value: { scale: obj.transform.scale } });
}

// Revert an AI-generated object back to its clean procedural model
document.getElementById('simpleBtn').onclick = () => {
  if (selected?.type !== 'object') return;
  const obj = sceneData.objects.find(o => o.id === selected.id);
  if (!obj || obj.asset?.type !== 'url') return;
  const variants = catalog.entries.filter(e => e.category === obj.category);
  const entry = variants[0] || catalog.entries.find(e => e.builder === 'generic');
  if (!entry) return;
  obj.asset = { type: 'catalog', ref: entry.id };
  rebuildObject(selected.id);
  select({ type: 'object', id: selected.id });
  emitOp({ op: 'swap', target: selected.id, value: { ref: entry.id } });
};
function rotateSelected(deg) {
  if (selected?.type !== 'object') return;
  const obj = sceneData.objects.find(o => o.id === selected.id);
  const group = objectGroups.get(selected.id);
  if (!obj || !group) return;
  obj.transform.rot_y_deg = ((obj.transform.rot_y_deg || 0) + deg) % 360;
  group.rotation.y = THREE.MathUtils.degToRad(obj.transform.rot_y_deg);
  if (highlight) highlight.update();
  emitOp({ op: 'rotate', target: selected.id, value: { rot_y_deg: obj.transform.rot_y_deg } });
}

document.getElementById('obj-color').addEventListener('change', (e) => {
  if (selected?.type !== 'object') return;
  const obj = sceneData.objects.find(o => o.id === selected.id);
  if (!obj) return;
  obj.material_override = { ...(obj.material_override || {}), color: e.target.value };
  rebuildObject(selected.id);
  if (highlight) { scene3.remove(highlight); highlight = new THREE.BoxHelper(objectGroups.get(selected.id), 0xC98E5A); scene3.add(highlight); }
  emitOp({ op: 'recolor', target: selected.id, value: { color: e.target.value } });
});

document.getElementById('shell-color').addEventListener('change', (e) => {
  if (!selected || selected.type === 'object') return;
  if (selected.type === 'feature') {
    const f = (sceneData.room.features || []).find(x => x.id === selected.id);
    if (!f) return;
    f.color = e.target.value;
    buildRoom();
    emitOp({ op: 'recolor', target: f.id, value: { color: e.target.value } });
    return;
  }
  const key = selected.type === 'floor' ? 'floor_material' : 'wall_material';
  sceneData.room[key].color = e.target.value;
  buildRoom();
  emitOp({ op: 'recolor', target: selected.type === 'floor' ? 'floor' : 'wall', value: { color: e.target.value } });
});

document.getElementById('swapBtn').onclick = () => {
  if (selected?.type !== 'object') return;
  const obj = sceneData.objects.find(o => o.id === selected.id);
  if (!obj) return;
  const variants = catalog.entries.filter(e => e.category === obj.category);
  if (variants.length < 2) { setStatus('No other models for this category yet'); return; }
  const idx = variants.findIndex(v => v.id === obj.asset?.ref);
  const next = variants[(idx + 1) % variants.length];
  obj.asset = { type: 'catalog', ref: next.id };
  obj.dimensions_m = [...next.dims_m];
  obj.label = next.name;
  rebuildObject(selected.id);
  select({ type: 'object', id: selected.id });
  emitOp({ op: 'swap', target: selected.id, value: { ref: next.id } });
};

document.getElementById('delBtn').onclick = () => {
  if (selected?.type !== 'object') return;
  const id = selected.id;
  sceneData.objects = sceneData.objects.filter(o => o.id !== id);
  rebuildObject(id);
  deselect();
  emitOp({ op: 'remove', target: id, value: {} });
};

document.getElementById('dupBtn').onclick = () => {
  if (selected?.type !== 'object') return;
  const src = sceneData.objects.find(o => o.id === selected.id);
  if (!src) return;
  const copy = JSON.parse(JSON.stringify(src));
  copy.id = `${src.category}_c${localIdCounter++}${Date.now() % 10000}`;
  copy.transform.pos = [round3(src.transform.pos[0] + (src.dimensions_m?.[0] || 1) + 0.1), 0, round3(src.transform.pos[2])];
  sceneData.objects.push(copy);
  rebuildObject(copy.id);
  emitOp({ op: 'add', value: { object: copy } });
  select({ type: 'object', id: copy.id });
};

// Add furniture panel
addBtn.onclick = () => {
  deselect(false);
  addBtn.classList.add('hidden');
  const list = document.getElementById('catalog-list');
  list.innerHTML = '';
  catalog.entries.forEach(entry => {
    const el = document.createElement('div');
    el.className = 'cat-item';
    el.textContent = entry.name;
    el.onclick = () => addFromCatalog(entry);
    list.appendChild(el);
  });
  addPanel.classList.add('visible');
};
document.getElementById('addCloseBtn').onclick = () => deselect();

function addFromCatalog(entry) {
  const obj = {
    id: `${entry.category}_n${localIdCounter++}${Date.now() % 10000}`,
    category: entry.category,
    label: entry.name,
    asset: { type: 'catalog', ref: entry.id },
    transform: { pos: [0, 0, 0], rot_y_deg: 0, scale: [1, 1, 1] },
    dimensions_m: [...entry.dims_m],
    material_override: null,
    source: { detected_from: 'user_added' },
  };
  sceneData.objects.push(obj);
  rebuildObject(obj.id);
  emitOp({ op: 'add', value: { object: obj } });
  deselect(false);
  select({ type: 'object', id: obj.id });
}

// ---------------- Public API for Flutter ----------------
window.RAI = {
  loadScene(data, cat) {
    sceneData = typeof data === 'string' ? JSON.parse(data) : data;
    if (cat) catalog = typeof cat === 'string' ? JSON.parse(cat) : cat;
    deselect(false);
    rebuildAll();
  },
  // Push a fresh authoritative scene (after NL edit / undo) without losing the camera
  refreshScene(data) {
    sceneData = typeof data === 'string' ? JSON.parse(data) : data;
    deselect(false);
    rebuildAll();
  },
  // Screenshot of the current 3D view (Flutter calls this for photoreal rendering)
  captureRender() {
    return captureCanvas();
  },
  // Show a photoreal result pushed back from Flutter
  showRender(dataUrl) {
    showRender(dataUrl);
  },
};

initGL();
if (STANDALONE) {
  setStatus('Loading your 3D room…');
  standaloneInit();
} else {
  setStatus('Waiting for room data…');
  send('ready', {});
}
</script>
</body>
