# Production-oriented stack for Hetzner / VPS
# Usage (on server, from repo root):
#   docker compose up -d --build
#
# Public HTTPS: https://62.238.120.111.sslip.io
# (Caddy terminates TLS; API stays private on the Docker network)

services:
  db:
    image: postgres:16-alpine
    container_name: reimagine-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: reimagine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reimagine}
      POSTGRES_DB: reimagine_ai
    volumes:
      - reimagine_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reimagine -d reimagine_ai"]
      interval: 5s
      timeout: 5s
      retries: 10
    expose:
      - "5432"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reimagine-api
    restart: unless-stopped
    # Not published publicly — reach via Caddy on 443
    expose:
      - "8100"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://reimagine:${POSTGRES_PASSWORD:-reimagine}@db:5432/reimagine_ai
      DEBUG: "false"
    volumes:
      - app_meshes:/app/data/meshes
      - app_generated:/app/data/generated
      - app_scene_images:/app/data/scene_images
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8100/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  caddy:
    image: caddy:2-alpine
    container_name: reimagine-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  reimagine_pgdata:
  app_meshes:
  app_generated:
  app_scene_images:
  caddy_data:
  caddy_config:
