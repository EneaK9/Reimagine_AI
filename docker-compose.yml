services:
  db:
    image: postgres:16-alpine
    container_name: reimagine-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: reimagine
      POSTGRES_PASSWORD: reimagine
      POSTGRES_DB: reimagine_ai
    ports:
      - "5432:5432"
    volumes:
      - reimagine_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reimagine -d reimagine_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  reimagine_pgdata:
